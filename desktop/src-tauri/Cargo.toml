[package]
name = "qora-qarga-desktop"
version = "0.1.0"
description = "Qora Qarg'a messenger desktop client"
authors = ["Cognilabs"]
edition = "2021"
rust-version = "1.77.2"

# The binary is a thin shell around the library so the same entry point can be
# reused by `tauri android`/`ios` later without moving code.
[lib]
name = "qora_qarga_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP from Rust, which is what lets the app talk to the API without the
# backend having to allowlist a `tauri://localhost` origin for CORS.
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
